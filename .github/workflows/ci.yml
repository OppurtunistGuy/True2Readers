name: CI

# One job named "check". Make it a required status check in the branch protection
# rules for main (and uat) once it has run at least once.
on:
  push:
    branches: [main, uat, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repo rules (one lockfile, pinned Prisma, no migrations in build hooks)
        run: npm run check:repo
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build (accounts off, the default)
        run: npm run build
